server:
  port: 8080

spring:
  application:
    name: ai-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

external:
  prometheus:
    base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
  llm:
    base-url: ${LLM_BASE_URL:https://api.openai.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}

  alert:
    call-llm-only-critical: ${CALL_LLM_ONLY_CRITICAL:false}