server:
  port: 8080

spring:
  application:
    name: ai-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

ai-service:
  prometheus:
    base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}

  llm:
    enabled: ${LLM_ENABLED:true}
    base-url: ${LLM_BASE_URL}
    api-key: ${LLM_API_KEY}
    model: ${LLM_MODEL:gpt-4o-mini}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:20}

  slack:
    webhook-url: ${SLACK_WEBHOOK_URL}
    timeout-seconds: ${SLACK_TIMEOUT_SECONDS:10}

  alert:
    call-llm-only-critical: ${CALL_LLM_ONLY_CRITICAL:false}